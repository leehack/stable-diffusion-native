name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tools:
    name: tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the Mach-O import audit tests that other hosts skip.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The wrapper tests compile against upstream's header.
          submodules: true
      - run: python3 -m unittest discover -s tests -v

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runs_on: macos-latest }
          - { target: macos-x64, runs_on: macos-latest }
          - { target: ios-arm64, runs_on: macos-latest }
          - { target: ios-arm64-sim, runs_on: macos-latest }
          - { target: ios-x64-sim, runs_on: macos-latest }
          - { target: android-arm64, runs_on: ubuntu-latest }
          - { target: linux-x64, runs_on: ubuntu-latest, smoke: "--expect-device CPU" }
          - { target: linux-x64-vulkan, runs_on: ubuntu-latest, smoke: "--expect-device Vulkan" }
          - { target: windows-x64, runs_on: windows-2022, smoke: "--expect-device CPU" }
          - { target: windows-x64-vulkan, runs_on: windows-2022, smoke: "--expect-device CPU" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          target: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: python tools/build.py build --target ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Validate exports and dependencies
        shell: bash
        run: python tools/validate_artifacts.py ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Load and list devices
        # Linux Vulkan runs on Mesa lavapipe (software): functional check only.
        if: matrix.smoke
        shell: bash
        run: python tools/smoke_test.py ${{ matrix.target }} ${{ matrix.smoke }}
        env:
          # ggml skips CPU-type Vulkan devices such as lavapipe unless listed.
          GGML_VK_VISIBLE_DEVICES: "0"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: bin-${{ matrix.target }}
          path: bin/${{ matrix.target }}
          if-no-files-found: error

  apple-xcframework:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Stage payloads
        run: |
          for dir in artifacts/bin-*; do
            mkdir -p "bin/${dir#artifacts/bin-}"
            cp -R "$dir"/. "bin/${dir#artifacts/bin-}/"
          done
      - name: Build and validate the XCFramework
        run: python3 tools/apple_xcframework.py build --tag v0.0.0 --dist dist
      - name: Validate the XCFramework privacy manifests
        run: >-
          python3 tools/apple_privacy_manifest.py --audit-imports
          dist/stable-diffusion-native-apple-xcframework-v0.0.0.zip
      - name: Link the XCFramework into a SwiftPM consumer
        run: python3 tools/apple_xcframework.py consumer dist/stable-diffusion-native-apple-xcframework-v0.0.0.zip
