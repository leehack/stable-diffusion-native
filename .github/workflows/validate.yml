name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tools:
    name: tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the Mach-O import audit tests that other hosts skip.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The wrapper tests compile against upstream's and ggml's headers.
          submodules: recursive
      - run: python3 -m unittest discover -s tests -v

  dart-vm:
    name: dart vm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned: the harness expects this VM's aborts in its controls.
          sdk: 3.13.5
      - name: Report progress while the Dart VM shuts down
        run: python3 -m unittest discover -s tests -p test_progress_stress.py -v
        env:
          SD_REQUIRE_DART: "1"
          SD_PROGRESS_STRESS_RUNS: "25"

  exit-teardown:
    name: exit teardown (${{ matrix.runtime }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runtime as shipped, and one in which a use after free aborts.
          - { runtime: release, sanitizer: "" }
          - { runtime: address sanitizer, sanitizer: address }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          target: macos-arm64
      - uses: dart-lang/setup-dart@v1
        if: ${{ !matrix.sanitizer }}
        with:
          sdk: 3.13.5
      - name: Build
        if: ${{ !matrix.sanitizer }}
        run: python3 tools/build.py build --target macos-arm64
      - name: Free tracked contexts at exit
        # With a sanitizer the test builds its own runtime, which the Dart VM
        # cannot load. The model is written by the test; nothing is
        # downloaded.
        run: python3 -m unittest discover -s tests -p test_exit_teardown_runtime.py -v
        env:
          SD_REQUIRE_RUNTIME: "1"
          SD_REQUIRE_DART: ${{ !matrix.sanitizer && '1' || '' }}
          SD_EXIT_TEARDOWN_SANITIZER: ${{ matrix.sanitizer }}
          SD_EXIT_TEARDOWN_RUNS: "3"

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runs_on: macos-latest, smoke: "--expect-device CPU" }
          - { target: macos-x64, runs_on: macos-latest }
          - { target: ios-arm64, runs_on: macos-latest }
          - { target: ios-arm64-sim, runs_on: macos-latest }
          - { target: ios-x64-sim, runs_on: macos-latest }
          - { target: android-arm64, runs_on: ubuntu-latest }
          - { target: linux-x64, runs_on: ubuntu-latest, smoke: "--expect-device CPU" }
          - { target: linux-x64-vulkan, runs_on: ubuntu-latest, smoke: "--expect-device Vulkan" }
          - { target: windows-x64, runs_on: windows-2022, smoke: "--expect-device CPU" }
          - { target: windows-x64-vulkan, runs_on: windows-2022, smoke: "--expect-device CPU" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          target: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: python tools/build.py build --target ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Validate exports and dependencies
        shell: bash
        run: python tools/validate_artifacts.py ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - name: Load and list devices
        # Linux Vulkan runs on Mesa lavapipe (software): functional check only.
        if: matrix.smoke
        shell: bash
        run: python tools/smoke_test.py ${{ matrix.target }} ${{ matrix.smoke }}
        env:
          # ggml skips CPU-type Vulkan devices such as lavapipe unless listed.
          GGML_VK_VISIBLE_DEVICES: "0"
      - name: Exit with calls in flight
        # On Linux exit() frees nothing, keeps the library's statics alive and
        # waits only for a host that asked. The scenarios have to pass on the
        # CPU; the Vulkan target's on lavapipe are reported.
        if: runner.os == 'Linux' && matrix.smoke
        run: python3 -m unittest discover -s tests -p test_exit_teardown_runtime.py -v
        env:
          SD_EXIT_TEARDOWN_TARGET: ${{ matrix.target }}
          SD_EXIT_TEARDOWN_RUNS: "3"
          GGML_VK_VISIBLE_DEVICES: "0"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: bin-${{ matrix.target }}
          path: bin/${{ matrix.target }}
          if-no-files-found: error

  apple-xcframework:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Stage payloads
        run: |
          for dir in artifacts/bin-*; do
            mkdir -p "bin/${dir#artifacts/bin-}"
            cp -R "$dir"/. "bin/${dir#artifacts/bin-}/"
          done
      - name: Build and validate the XCFramework
        run: python3 tools/apple_xcframework.py build --tag v0.0.0 --dist dist
      - name: Validate the XCFramework privacy manifests
        run: >-
          python3 tools/apple_privacy_manifest.py --audit-imports
          dist/stable-diffusion-native-apple-xcframework-v0.0.0.zip
      - name: Link the XCFramework into a SwiftPM consumer
        run: python3 tools/apple_xcframework.py consumer dist/stable-diffusion-native-apple-xcframework-v0.0.0.zip
